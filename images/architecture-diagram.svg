<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1480" width="680" height="1480" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow-teal" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto-start-reverse">
      <polygon points="0 0, 12 4, 0 8" fill="#008C95"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto-start-reverse">
      <polygon points="0 0, 12 4, 0 8" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="1480" fill="#FAFBFC" rx="8"/>

  <!-- Title -->
  <text x="340" y="42" text-anchor="middle" font-size="28" font-weight="700" fill="#1B2A4A">GAVUN WUD</text>
  <text x="340" y="66" text-anchor="middle" font-size="13" fill="#6B7B8D" letter-spacing="2">ORIGIN · TWO BRIDGES · BASE LIQUIDITY</text>

  <!-- ==================== -->
  <!-- 1. POLKADOT ASSET HUB -->
  <!-- ==================== -->
  <rect x="60" y="90" width="560" height="150" rx="6" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/>
  <rect x="60" y="90" width="560" height="32" rx="6" fill="#1B2A4A"/>
  <rect x="60" y="110" width="560" height="12" fill="#1B2A4A"/>
  <text x="340" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">POLKADOT ASSET HUB</text>
  <!-- Checkmark -->
  <circle cx="596" cy="114" r="18" fill="#059669"/>
  <text x="596" y="121" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">&#10003;</text>

  <!-- Token label -->
  <text x="340" y="152" text-anchor="middle" font-size="18" font-weight="700" fill="#1B2A4A">GAVUN WUD · WUD</text>
  <rect x="245" y="162" width="190" height="26" rx="4" fill="#E8F4F5" stroke="#008C95" stroke-width="1"/>
  <text x="340" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#008C95">Asset ID: 31337</text>

  <!-- Labels -->
  <text x="140" y="216" font-size="11" fill="#6B7B8D">&#9670; Original asset issuance</text>
  <text x="310" y="216" font-size="11" fill="#6B7B8D">&#9670; Community-owned</text>
  <text x="460" y="216" font-size="11" fill="#6B7B8D">&#10007; Admin rights renounced</text>

  <!-- ==================== -->
  <!-- SNOWBRIDGE (connector) -->
  <!-- ==================== -->
  <!-- Arrows: Asset Hub to Snowbridge (teal down on left, orange up on right) -->
  <line x1="305" y1="240" x2="305" y2="278" stroke="#008C95" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <line x1="375" y1="278" x2="375" y2="240" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="268" y="265" text-anchor="end" font-size="10" fill="#008C95">Bridge to Ethereum</text>
  <text x="412" y="265" font-size="10" fill="#D97706">Return to Asset Hub</text>

  <rect x="120" y="280" width="440" height="90" rx="6" fill="#F0F7FF" stroke="#4A90D9" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="340" y="305" text-anchor="middle" font-size="14" font-weight="700" fill="#1B2A4A">SNOWBRIDGE</text>
  <!-- Checkmark -->
  <circle cx="536" cy="304" r="18" fill="#059669"/>
  <text x="536" y="311" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">&#10003;</text>
  <text x="340" y="323" text-anchor="middle" font-size="11" fill="#6B7B8D">Polkadot &#8596; Ethereum · Trustless System Bridge</text>

  <!-- Side note -->
  <text x="340" y="348" text-anchor="middle" font-size="10" fill="#4A90D9">WUD support enabled through Polkadot OpenGov · 2025</text>
  <text x="340" y="362" text-anchor="middle" font-size="10" fill="#4A90D9">Available in the Snowbridge interface</text>

  <!-- Arrows: Snowbridge to Ethereum -->
  <line x1="305" y1="372" x2="305" y2="408" stroke="#008C95" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <line x1="375" y1="408" x2="375" y2="372" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

  <!-- ==================== -->
  <!-- 3. ETHEREUM -->
  <!-- ==================== -->
  <rect x="60" y="410" width="560" height="120" rx="6" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/>
  <rect x="60" y="410" width="560" height="32" rx="6" fill="#1B2A4A"/>
  <rect x="60" y="430" width="560" height="12" fill="#1B2A4A"/>
  <text x="340" y="432" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">ETHEREUM</text>
  <!-- Checkmark -->
  <circle cx="596" cy="434" r="18" fill="#059669"/>
  <text x="596" y="441" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">&#10003;</text>

  <text x="340" y="472" text-anchor="middle" font-size="18" font-weight="700" fill="#1B2A4A">WUD · ERC-20</text>
  <text x="340" y="492" text-anchor="middle" font-size="11" fill="#6B7B8D">Snowbridge representation of Asset Hub WUD</text>
  <text x="340" y="510" text-anchor="middle" font-size="10" fill="#8B9DB5" font-family="monospace">0x5FDcD48F09FB67de3D202cd854B372AEC1100ED5</text>

  <!-- ==================== -->
  <!-- WORMHOLE WTT (connector) -->
  <!-- ==================== -->
  <!-- Arrows: Ethereum to Wormhole -->
  <line x1="305" y1="532" x2="305" y2="568" stroke="#008C95" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <line x1="375" y1="568" x2="375" y2="532" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="193" y="555" text-anchor="end" font-size="10" fill="#008C95">Lock on ETH &#8594; Mint on Base</text>
  <text x="487" y="555" font-size="10" fill="#D97706">Burn on Base &#8594; Release on ETH</text>

  <rect x="120" y="570" width="440" height="100" rx="6" fill="#FFF7ED" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="340" y="595" text-anchor="middle" font-size="14" font-weight="700" fill="#1B2A4A">WORMHOLE WTT</text>
  <!-- Checkmark -->
  <circle cx="536" cy="594" r="18" fill="#059669"/>
  <text x="536" y="601" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">&#10003;</text>
  <text x="340" y="613" text-anchor="middle" font-size="11" fill="#6B7B8D">Wrapped Token Transfers · 19 Guardian Network</text>

  <!-- Attestation badge -->
  <rect x="230" y="625" width="220" height="34" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1"/>
  <text x="340" y="641" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">&#10003; Base token registration complete</text>
  <text x="340" y="655" text-anchor="middle" font-size="9" fill="#6B7B8D">One-time token attestation</text>

  <!-- Arrows: Wormhole to Base -->
  <line x1="305" y1="672" x2="305" y2="708" stroke="#008C95" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <line x1="375" y1="708" x2="375" y2="672" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-orange)"/>

  <!-- ==================== -->
  <!-- 5. BASE -->
  <!-- ==================== -->
  <rect x="60" y="710" width="560" height="330" rx="6" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="2"/>
  <rect x="60" y="710" width="560" height="32" rx="6" fill="#1B2A4A"/>
  <rect x="60" y="730" width="560" height="12" fill="#1B2A4A"/>
  <text x="340" y="732" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="1">BASE</text>
  <!-- Checkmark -->
  <circle cx="596" cy="734" r="18" fill="#059669"/>
  <text x="596" y="741" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">&#10003;</text>

  <text x="340" y="772" text-anchor="middle" font-size="18" font-weight="700" fill="#1B2A4A">WUD · Wormhole-wrapped ERC-20</text>
  <text x="340" y="792" text-anchor="middle" font-size="11" fill="#6B7B8D">Backed by WUD locked on Ethereum</text>
  <text x="340" y="810" text-anchor="middle" font-size="10" fill="#8B9DB5" font-family="monospace">0xfd4bf08b1583f1cfd2f9a3eadc696ec5e6c55239</text>

  <!-- Arrows to pool -->
  <line x1="305" y1="822" x2="305" y2="858" stroke="#008C95" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <line x1="375" y1="858" x2="375" y2="822" stroke="#D97706" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="268" y="845" text-anchor="end" font-size="10" fill="#008C95">Add liquidity</text>
  <text x="412" y="845" font-size="10" fill="#D97706">Remove liquidity</text>

  <!-- Uniswap v4 Pool -->
  <rect x="120" y="860" width="440" height="100" rx="6" fill="#FAFAFA" stroke="#C4C4C4" stroke-width="1.5"/>
  <!-- PoolManager frame -->
  <text x="545" y="878" text-anchor="end" font-size="9" fill="#AAAAAA">PoolManager</text>
  <rect x="150" y="885" width="380" height="50" rx="4" fill="#F5F0FF" stroke="#7B61FF" stroke-width="1"/>
  <text x="340" y="907" text-anchor="middle" font-size="14" font-weight="700" fill="#1B2A4A">UNISWAP v4</text>
  <!-- Checkmark -->
  <circle cx="506" cy="899" r="18" fill="#059669"/>
  <text x="506" y="906" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">&#10003;</text>
  <text x="340" y="925" text-anchor="middle" font-size="11" fill="#6B7B8D">WUD / ETH liquidity pool</text>

  <!-- Pool captions -->
  <text x="340" y="952" text-anchor="middle" font-size="10" fill="#8B9DB5">Two-way swaps · Liquidity provision requires both WUD and ETH</text>

  <!-- Pool bottom padding within Base -->
  <text x="340" y="1030" text-anchor="middle" font-size="1" fill="transparent">.</text>

  <!-- ==================== -->
  <!-- 6. MOBILE APP SCREENS -->
  <!-- ==================== -->

  <!-- LEFT PHONE: Uniswap -->
  <rect x="100" y="1070" width="170" height="260" rx="20" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/>
  <!-- Notch -->
  <rect x="155" y="1070" width="60" height="8" rx="4" fill="#333333"/>
  <!-- Status bar -->
  <rect x="115" y="1085" width="140" height="20" rx="0" fill="#FF007A"/>
  <text x="185" y="1099" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Uniswap App</text>
  <!-- Content -->
  <rect x="120" y="1115" width="130" height="30" rx="4" fill="#FFF0F5" stroke="#FF007A" stroke-width="1"/>
  <text x="185" y="1135" text-anchor="middle" font-size="12" font-weight="600" fill="#FF007A">WUD</text>
  <rect x="120" y="1155" width="130" height="20" rx="3" fill="#F5F5F5"/>
  <text x="185" y="1169" text-anchor="middle" font-size="10" fill="#6B7B8D">Uniswap v4 pool</text>
  <!-- Placeholder lines -->
  <rect x="120" y="1185" width="100" height="8" rx="2" fill="#F0F0F0"/>
  <rect x="120" y="1200" width="80" height="8" rx="2" fill="#F0F0F0"/>
  <rect x="120" y="1215" width="110" height="8" rx="2" fill="#F0F0F0"/>
  <rect x="120" y="1235" width="130" height="30" rx="6" fill="#FF007A"/>
  <text x="185" y="1255" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">Swap</text>
  <!-- Home bar -->
  <rect x="155" y="1310" width="60" height="5" rx="3" fill="#CCCCCC"/>
  <!-- Checkmark -->
  <circle cx="252" cy="1088" r="18" fill="#059669"/>
  <text x="252" y="1095" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">&#10003;</text>

  <!-- RIGHT PHONE: Coinbase -->
  <rect x="410" y="1070" width="170" height="260" rx="20" fill="#FFFFFF" stroke="#333333" stroke-width="2.5"/>
  <!-- Notch -->
  <rect x="465" y="1070" width="60" height="8" rx="4" fill="#333333"/>
  <!-- Status bar -->
  <rect x="425" y="1085" width="140" height="20" rx="0" fill="#30D5C8"/>
  <text x="495" y="1099" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Coinbase App</text>
  <!-- Content -->
  <rect x="430" y="1115" width="130" height="30" rx="4" fill="#F0FFFE" stroke="#30D5C8" stroke-width="1"/>
  <text x="495" y="1135" text-anchor="middle" font-size="12" font-weight="600" fill="#30D5C8">WUD</text>
  <rect x="430" y="1155" width="130" height="20" rx="3" fill="#F5F5F5"/>
  <text x="495" y="1169" text-anchor="middle" font-size="10" fill="#6B7B8D">Pool visibility</text>
  <!-- Placeholder lines -->
  <rect x="430" y="1185" width="100" height="8" rx="2" fill="#F0F0F0"/>
  <rect x="430" y="1200" width="80" height="8" rx="2" fill="#F0F0F0"/>
  <rect x="430" y="1215" width="110" height="8" rx="2" fill="#F0F0F0"/>
  <rect x="430" y="1235" width="130" height="30" rx="6" fill="#30D5C8"/>
  <text x="495" y="1255" text-anchor="middle" font-size="11" font-weight="600" fill="#FFFFFF">View</text>
  <!-- Home bar -->
  <rect x="465" y="1310" width="60" height="5" rx="3" fill="#CCCCCC"/>
  <!-- Checkmark -->
  <circle cx="562" cy="1088" r="18" fill="#059669"/>
  <text x="562" y="1095" text-anchor="middle" font-size="24" font-weight="700" fill="#FFFFFF">&#10003;</text>

  <!-- Dashed lines from phones to pool -->
  <line x1="185" y1="1070" x2="270" y2="960" stroke="#AAAAAA" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="495" y1="1070" x2="410" y2="960" stroke="#AAAAAA" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Group caption -->
  <text x="340" y="988" text-anchor="middle" font-size="11" fill="#8B9DB5">Pool visible through both apps</text>

  <!-- ==================== -->
  <!-- LEGEND -->
  <!-- ==================== -->
  <rect x="140" y="1400" width="400" height="60" rx="6" fill="#F5F6F8" stroke="#DDE1E6" stroke-width="1"/>
  <text x="340" y="1420" text-anchor="middle" font-size="11" font-weight="600" fill="#1B2A4A">LEGEND</text>

  <!-- Teal -->
  <line x1="175" y1="1440" x2="215" y2="1440" stroke="#008C95" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <text x="225" y="1444" font-size="10" fill="#6B7B8D">Forward route</text>

  <!-- Orange -->
  <line x1="320" y1="1440" x2="360" y2="1440" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="370" y="1444" font-size="10" fill="#6B7B8D">Return route</text>

  <!-- Gray dashed -->
  <line x1="455" y1="1440" x2="495" y2="1440" stroke="#AAAAAA" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="505" y="1444" font-size="10" fill="#6B7B8D">Interface</text>
</svg>
